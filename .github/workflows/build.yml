name: Build All Platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  RUST_VERSION: '1.75'
  VCPKGGIT_COMMIT: '2023.04.15'

jobs:
  # ─────────────────────────────────────────────
  # Linux x64
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip g++ gcc git curl wget nasm yasm libgtk-3-dev clang \
            libxcb-randr0-dev libxdo-dev libxfixes-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libasound2-dev libpulse-dev cmake make \
            libclang-dev ninja-build libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libpam0g-dev pkg-config

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          cd "$HOME/vcpkg"
          git checkout ${{ env.VCPKGGIT_COMMIT }}
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg --disable-metrics install libvpx libyuv opus aom

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Build Rust library (Flutter)
        env:
          VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
        run: |
          cd "${HOME}/vcpkg/.." && echo "VCPKG_ROOT=$(pwd)/vcpkg"
          export VCPKG_ROOT="$HOME/vcpkg"
          cargo build --locked --features flutter,hwcodec --release

      - name: Build Flutter Linux
        run: |
          cd flutter
          flutter pub get
          $HOME/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ../src/flutter_ffi.rs \
            --dart-output ./lib/generated_bridge.dart \
            --c-output ./macos/Runner/bridge_generated.h
          flutter build linux --release

      - name: Package
        run: |
          cd flutter/build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/rustdesk-linux-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-x64
          path: rustdesk-linux-x64.tar.gz

  # ─────────────────────────────────────────────
  # Windows x64
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          cd C:\vcpkg
          git checkout ${{ env.VCPKGGIT_COMMIT }}
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg --disable-metrics install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Build Rust library (Flutter)
        env:
          VCPKG_ROOT: C:\vcpkg
        run: cargo build --locked --features flutter,hwcodec --release

      - name: Build Flutter Windows
        run: |
          cd flutter
          flutter pub get
          $HOME/.cargo/bin/flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./macos/Runner/bridge_generated.h
          flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: flutter/build/windows/x64/runner/Release/

  # ─────────────────────────────────────────────
  # Android (arm64 + arm32)
  # ─────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-22.04
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r25c
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip g++ gcc git curl wget nasm yasm clang cmake make ninja-build pkg-config libclang-dev

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          git checkout ${{ env.VCPKGGIT_COMMIT }}
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Add Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build vcpkg deps for Android (arm64)
        run: |
          cd flutter
          bash ./build_android_deps.sh arm64-v8a

      - name: Build vcpkg deps for Android (arm32)
        run: |
          cd flutter
          bash ./build_android_deps.sh armeabi-v7a

      - name: Build Rust library for Android (arm64)
        run: |
          cd flutter
          bash ./ndk_arm64.sh

      - name: Build Rust library for Android (arm32)
        run: |
          cd flutter
          bash ./ndk_arm.sh

      - name: Build APK
        run: |
          cd flutter
          flutter pub get
          flutter build apk \
            --target-platform android-arm64,android-arm \
            --release \
            --split-per-abi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android
          path: flutter/build/app/outputs/flutter-apk/*.apk

  # ─────────────────────────────────────────────
  # macOS (arm64 + x64 universal)
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          cd "$HOME/vcpkg"
          git checkout ${{ env.VCPKGGIT_COMMIT }}
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg --disable-metrics install libvpx libyuv opus aom

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Add Rust targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Build Rust library (Flutter)
        env:
          VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
        run: |
          export VCPKG_ROOT="$HOME/vcpkg"
          cargo build --locked --features flutter,hwcodec --release

      - name: Build Flutter macOS
        run: |
          cd flutter
          flutter pub get
          $HOME/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ../src/flutter_ffi.rs \
            --dart-output ./lib/generated_bridge.dart \
            --c-output ./macos/Runner/bridge_generated.h
          flutter build macos --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos
          path: flutter/build/macos/Build/Products/Release/

  # ─────────────────────────────────────────────
  # Release: collect all artifacts
  # ─────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-android, build-macos]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/rustdesk-linux-x64/*
            artifacts/rustdesk-windows-x64/*
            artifacts/rustdesk-android/*
            artifacts/rustdesk-macos/*
