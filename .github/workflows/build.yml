name: Build All Platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  # ─────────────────────────────────────────────
  # Linux x64
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip g++ gcc git curl wget nasm yasm libgtk-3-dev clang \
            libxcb-randr0-dev libxdo-dev libxfixes-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libasound2-dev libpulse-dev cmake make \
            libclang-dev ninja-build libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libpam0g-dev pkg-config \
            libunwind-dev

      - name: Install vcpkg and build deps
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          cd "$VCPKG_ROOT"
          git checkout 120deac3062162151622ca4860575a33844ba10b
          ./bootstrap-vcpkg.sh -disableMetrics
          "$VCPKG_ROOT/vcpkg" --disable-metrics install --x-manifest-root=$GITHUB_WORKSPACE --x-install-root=$VCPKG_ROOT/installed
          echo "VCPKG_INSTALLED_ROOT=$VCPKG_ROOT/installed" >> $GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Generate bridge code (MUST run before cargo build)
        run: |
          cd flutter
          flutter pub get
          $HOME/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ../src/flutter_ffi.rs \
            --dart-output ./lib/generated_bridge.dart \
            --c-output ./macos/Runner/bridge_generated.h

      - name: Build Rust library (Flutter)
        env:
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg/installed
        run: cargo build --locked --features flutter,hwcodec --release

      - name: Build Flutter Linux
        run: |
          cd flutter
          flutter build linux --release

      - name: Package
        run: |
          cd flutter/build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/rustdesk-linux-x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-x64
          path: rustdesk-linux-x64.tar.gz

  # ─────────────────────────────────────────────
  # Windows x64
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg and build deps
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          cd "$env:VCPKG_ROOT"
          git checkout 120deac3062162151622ca4860575a33844ba10b
          .\bootstrap-vcpkg.bat -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" --disable-metrics install --x-manifest-root="$env:GITHUB_WORKSPACE" --x-install-root="$env:VCPKG_ROOT\installed"
          echo "VCPKG_INSTALLED_ROOT=$env:VCPKG_ROOT\installed" >> $env:GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Generate bridge code (MUST run before cargo build)
        shell: bash
        run: |
          cd flutter
          flutter pub get
          $HOME/.cargo/bin/flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./macos/Runner/bridge_generated.h

      - name: Build Rust library (Flutter)
        env:
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}\vcpkg\installed
        run: cargo build --locked --features flutter --release

      - name: Build Flutter Windows
        run: |
          cd flutter
          flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: flutter/build/windows/x64/runner/Release/

  # ─────────────────────────────────────────────
  # Android (arm64 + arm32)
  # ─────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-22.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip g++ gcc git curl wget nasm yasm clang cmake make ninja-build pkg-config libclang-dev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r25c

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          cd "$VCPKG_ROOT"
          git checkout 120deac3062162151622ca4860575a33844ba10b
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Generate bridge code (MUST run before cargo build)
        run: |
          cd flutter
          flutter pub get
          $HOME/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ../src/flutter_ffi.rs \
            --dart-output ./lib/generated_bridge.dart \
            --c-output ./macos/Runner/bridge_generated.h

      - name: Build vcpkg deps for Android (arm64)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg/installed
        run: bash flutter/build_android_deps.sh arm64-v8a

      - name: Build vcpkg deps for Android (arm32)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg/installed
        run: bash flutter/build_android_deps.sh armeabi-v7a

      - name: Patch scrap build.rs and symlink headers for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          # 1. Patch scrap/build.rs to add /include subdir for bindgen
          sed -i 's|b = b.clang_arg(format!("-I{}", dir.display()));|b = b.clang_arg(format!("-I{}", dir.display())); b = b.clang_arg(format!("-I{}/include", dir.display()));|' libs/scrap/build.rs

          # 2. Symlink vcpkg headers into NDK sysroot so ALL crates (including magnum-opus) can find them
          SYSROOT_INCLUDE="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          for arch_dir in $VCPKG_ROOT/installed/arm64-android $VCPKG_ROOT/installed/arm-neon-android; do
            if [ -d "$arch_dir/include" ]; then
              for d in "$arch_dir/include"/*/; do
                pkg=$(basename "$d")
                ln -sf "$d" "$SYSROOT_INCLUDE/$pkg" 2>/dev/null || true
              done
            fi
          done

      - name: Create .cargo/config.toml and verify lib files
        run: |
          mkdir -p .cargo
          printf '[target.aarch64-linux-android]\nrustflags = ["-L", "%s/vcpkg/installed/arm64-android/lib"]\n\n[target.armv7-linux-androideabi]\nrustflags = ["-L", "%s/vcpkg/installed/arm-neon-android/lib"]\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > .cargo/config.toml
          cat .cargo/config.toml

      - name: Manually install opus and vpx for arm64-android (workaround for vcpkg manifest mode)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          # build_android_deps.sh may not install arm64-android to installed/ due to vcpkg manifest mode
          # Manually install opus and libvpx for arm64-android
          "$VCPKG_ROOT/vcpkg" install opus libvpx libyuv aom --triplet arm64-android --x-install-root="$VCPKG_ROOT/installed"
          # Verify
          ls -la "$VCPKG_ROOT/installed/arm64-android/lib/libopus.a" || echo "STILL MISSING opus"
          ls -la "$VCPKG_ROOT/installed/arm64-android/lib/libvpx.a" || echo "STILL MISSING vpx"

      - name: Build Rust library for Android (arm64, no hwcodec)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg/installed
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          OPENSSL_STATIC: "1"
          OPENSSL_VENDORED: "1"
        run: cargo ndk --platform 21 --target aarch64-linux-android build --locked --release --features flutter

      - name: Build Rust library for Android (arm32, no hwcodec)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg/installed
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          OPENSSL_STATIC: "1"
          OPENSSL_VENDORED: "1"
        run: cargo ndk --platform 21 --target armv7-linux-androideabi build --locked --release --features flutter

      - name: Build APK
        run: |
          cd flutter
          flutter build apk \
            --target-platform android-arm64,android-arm \
            --release \
            --split-per-abi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android
          path: flutter/build/app/outputs/flutter-apk/*.apk

  # ─────────────────────────────────────────────
  # macOS (arm64)
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: brew install nasm yasm

      - name: Install vcpkg and build deps
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          cd "$VCPKG_ROOT"
          git checkout 120deac3062162151622ca4860575a33844ba10b
          ./bootstrap-vcpkg.sh -disableMetrics
          "$VCPKG_ROOT/vcpkg" --disable-metrics install --x-manifest-root=$GITHUB_WORKSPACE --x-install-root=$VCPKG_ROOT/installed
          echo "VCPKG_INSTALLED_ROOT=$VCPKG_ROOT/installed" >> $GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Generate bridge code (MUST run before cargo build)
        run: |
          cd flutter
          flutter pub get
          $HOME/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ../src/flutter_ffi.rs \
            --dart-output ./lib/generated_bridge.dart \
            --c-output ./macos/Runner/bridge_generated.h

      - name: Build Rust library (Flutter)
        env:
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg/installed
        run: cargo build --locked --features flutter,hwcodec --release

      - name: Build Flutter macOS
        run: |
          cd flutter
          flutter build macos --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos
          path: flutter/build/macos/Build/Products/Release/

  # ─────────────────────────────────────────────
  # Release: collect all artifacts
  # ─────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-android, build-macos]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/rustdesk-linux-x64/*
            artifacts/rustdesk-windows-x64/*
            artifacts/rustdesk-android/*
            artifacts/rustdesk-macos/*
